<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#A68200" />
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="4" fill="url(#gold)" filter="url(#glow)" />
  <circle cx="16" cy="16" r="12" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8" />
  <circle cx="16" cy="16" r="14" fill="none" stroke="#000" stroke-width="0.5" opacity="0.3" />
  <circle cx="16" cy="16" r="10" fill="none" stroke="#000" stroke-width="0.5" opacity="0.3" />
</svg>
